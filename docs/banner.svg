<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Velzr Tweaks: Mehr FPS. Weniger Ping. Alles umkehrbar.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#101626"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7db0ff"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- Bildrate-Verlauf als Zierde, ohne Zahlen -->
  <path d="M0 316 L 520 300 C 600 296, 640 280, 700 270 S 800 250, 850 226 S 960 196, 1010 160 S 1130 112, 1280 84 L1280 360 L0 360 Z" fill="url(#fill)"/>
  <path d="M0 316 L 520 300 C 600 296, 640 280, 700 270 S 800 250, 850 226 S 960 196, 1010 160 S 1130 112, 1280 84" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1010" cy="160" r="6" fill="#7db0ff"/>

  <!-- Logo (wie in der App) -->
  <g transform="translate(96 84) scale(4.125)">
    <rect width="32" height="32" rx="9" fill="#2f6fe8"/>
    <path d="M7 8h4.6L16 18.4 20.4 8H25l-6.9 16h-4.2z" fill="#ffffff"/>
  </g>

  <!-- Texte -->
  <g font-family="Inter, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
    <text x="262" y="146" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2.5">Velzr <tspan fill="#5b9bff">Tweaks</tspan></text>
    <text x="264" y="196" font-size="30" font-weight="500" fill="#c5cbd6">Mehr FPS. Weniger Ping. Alles umkehrbar.</text>

    <g font-size="20" font-weight="600" fill="#c5cbd6">
      <rect x="264" y="236" width="196" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="362" y="266" text-anchor="middle">Windows 10 &amp; 11</text>
      <rect x="476" y="236" width="140" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="546" y="266" text-anchor="middle">Kostenlos</text>
      <rect x="632" y="236" width="196" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="730" y="266" text-anchor="middle">Für alle Spiele</text>
    </g>
  </g>
</svg>
